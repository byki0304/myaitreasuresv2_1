<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 AI 총무 · My AI Treasures</title>
<meta name="description" content="여러 사람이 대신 결제한 모임 비용을 공정하게 나누고 송금을 안내하는 정산 도우미">
<meta name="theme-color" content="#1F5F5B">
<meta name="application-name" content="나의 AI 총무">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나의 AI 총무">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<style>
:root{
  --cream:#FBF6EC; --cream-2:#F3EBDA; --paper:#FFFDF8;
  --teal:#1F5F5B; --teal-d:#143F3C; --teal-l:#D6E7E4;
  --sage:#9DB592; --sage-l:#E3EBDC;
  --apricot:#F2A57A; --apricot-l:#FCE5D5;
  --ink:#1B2F2D; --muted:#4F5E5B; --line:#DCD2BF;
  --danger:#A8231B; --danger-l:#FCE9E7; --ok:#2E6B3A;
  --radius:14px; --shadow:0 2px 10px rgba(20,63,60,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--apricot);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--teal);background:var(--paper);color:var(--teal);font-weight:600;cursor:pointer;text-align:center}
.btn:hover{background:var(--teal-l)}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-d)}
.btn-ghost{border-color:var(--line);color:var(--muted);background:transparent}
.btn-small{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

/* Logo */
.logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--teal-d);font-weight:800;font-size:1rem;letter-spacing:-.01em}
.logo svg{width:30px;height:30px;flex:none}

/* Start screen */
#screen-start{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.start-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.start-top,.start-main,.start-bottom{position:relative;z-index:1}
.start-top{padding:16px 20px}
.start-top .logo{background:rgba(255,253,248,.85);padding:6px 12px 6px 8px;border-radius:999px}
.start-main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 16px}
.start-card{max-width:600px;width:100%;background:rgba(255,253,248,.94);border-radius:24px;padding:32px 28px 30px;box-shadow:0 10px 34px rgba(20,63,60,.16);text-align:center;display:flex;flex-direction:column;align-items:center}
.start-eyebrow{display:inline-block;margin:0 0 4px;padding:3px 12px;border-radius:999px;background:var(--teal-l);color:var(--teal);font-weight:700;letter-spacing:.06em;font-size:.8rem}
.start-card h1{margin:6px 0 0;font-size:2.1rem;color:var(--teal-d);line-height:1.2}
.start-card h1::after{content:"";display:block;width:44px;height:4px;margin:12px auto 14px;border-radius:4px;background:var(--apricot)}
.start-card p{margin:0;max-width:36em;color:var(--ink);font-size:1.02rem;line-height:1.65}
#btn-start{margin-top:22px;min-width:200px;min-height:52px;font-size:1.1rem;box-shadow:0 6px 16px rgba(20,63,60,.22)}
.start-bottom{padding:12px 16px 24px;display:flex;justify-content:center}
.lang-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(255,253,248,.88);padding:6px;border-radius:999px;box-shadow:var(--shadow)}
.lang-btn{min-height:40px;padding:6px 16px;border-radius:999px;border:1.5px solid var(--teal);background:var(--paper);color:var(--teal);font-weight:600;cursor:pointer}
.lang-btn[aria-pressed="true"]{background:var(--teal);color:#fff}
.lang-caption{display:none}
.start-card{word-break:keep-all;overflow-wrap:anywhere}
#screen-start{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Start screen · mobile portrait: language picker becomes a 2-row card (caption + equal buttons) */
@media (max-width:600px) and (orientation:portrait){
  .start-top{padding:12px 16px}
  .start-main{padding:8px 16px}
  .start-card{padding:26px 20px 24px}
  .start-card h1{font-size:1.8rem}
  .start-card p{font-size:1rem;line-height:1.6}
  #btn-start{margin-top:20px;width:100%;max-width:280px}
  .start-bottom{padding:8px 16px 18px}
  .lang-pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;max-width:400px;gap:6px;padding:8px 8px 10px;border-radius:18px}
  .lang-caption{display:flex;grid-column:1/-1;align-items:center;justify-content:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--muted)}
  .lang-caption svg{width:16px;height:16px;flex:none}
  .lang-pills .lang-btn{padding:6px 4px;min-height:44px;white-space:nowrap}
}
@media (max-width:600px) and (orientation:portrait) and (max-height:600px){
  .start-card{padding:18px 14px}
  .start-card h1{font-size:1.5rem;margin-top:2px}
  .start-card h1::after{margin:8px auto 10px}
  .start-card p{font-size:.94rem;line-height:1.5}
  #btn-start{margin-top:14px;min-height:46px}
}

/* Start screen · short landscape (phones): language picker moves to the top bar, card gets compact */
@media (orientation:landscape) and (max-height:560px){
  .start-top{padding:10px 16px;padding-right:300px}
  .start-bottom{position:absolute;top:10px;right:16px;padding:0;z-index:2}
  .lang-pills{padding:4px;gap:6px}
  .lang-pills .lang-btn{min-height:36px;padding:4px 12px;font-size:.9rem}
  .start-main{padding:4px 16px 12px}
  .start-card{max-width:640px;padding:16px 24px}
  .start-eyebrow{font-size:.74rem;padding:2px 10px}
  .start-card h1{font-size:1.5rem;margin-top:2px}
  .start-card h1::after{width:36px;height:3px;margin:8px auto 10px}
  .start-card p{font-size:.94rem;line-height:1.5}
  #btn-start{margin-top:14px;min-height:44px;font-size:1rem}
}
@media (orientation:landscape) and (max-height:400px){
  .start-top .logo-text{display:none}
  .start-top .logo{padding:6px}
  .start-top{padding-right:16px}
  .start-card{padding:10px 20px}
  .start-card h1{font-size:1.3rem}
  .start-card p{font-size:.88rem}
}

/* App shell */
.app{min-height:100vh}
.sidebar{background:var(--teal-d);color:#fff}
.side-logo{display:block;padding:18px 18px 10px}
.side-logo .logo{color:#fff}
.side-nav,.side-lang{display:flex;flex-direction:column;gap:8px;padding:10px 14px}
.side-lang-label{font-size:.8rem;opacity:.8;padding:0 4px}
.nav-btn{min-height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-weight:600;cursor:pointer;padding:6px 12px;text-align:left}
.nav-btn:hover:not([disabled]){background:rgba(255,255,255,.1)}
.nav-btn[aria-current="page"]{background:var(--cream);color:var(--teal-d);border-color:var(--cream)}
.nav-btn[disabled]{opacity:.45;cursor:not-allowed}
.sidebar .lang-btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.sidebar .lang-btn[aria-pressed="true"]{background:var(--apricot);color:var(--teal-d);border-color:var(--apricot)}
.main{min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .logo{flex:none}
.topbar h1{font-size:1.1rem;margin:0;flex:1;min-width:0;color:var(--teal-d)}
.home-area{display:flex;align-items:center;gap:8px;margin-left:auto}
.home-note{font-size:.78rem;color:var(--muted);max-width:180px;text-align:right;line-height:1.3}
.home-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--teal);background:var(--paper);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.home-btn:hover{background:var(--teal-l)}
.home-btn svg{width:22px;height:22px}
.content{max-width:900px;margin:0 auto;padding:16px}

@media (min-width:1001px){
  .app{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .sidebar{position:sticky;top:0;height:100vh;overflow:auto}
  .topbar .logo{display:none}
}
@media (max-width:1000px){
  .sidebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.15)}
  .side-logo,.side-lang-label{display:none}
  .side-nav,.side-lang{display:contents}
  .nav-btn,.sidebar .lang-btn{text-align:center;min-height:44px;padding:4px 6px;font-size:.88rem;border-radius:12px}
  .main{padding-bottom:130px}
}
@media (max-width:1000px) and (orientation:portrait){
  .sidebar{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1000px) and (orientation:landscape){
  .sidebar{grid-template-columns:repeat(6,minmax(0,1fr))}
  .main{padding-bottom:76px}
}
@media (max-width:520px){
  .home-note{max-width:110px;font-size:.72rem}
  .topbar h1{font-size:1rem}
  .topbar .logo .logo-text{font-size:.85rem}
}
@media (max-width:400px){
  .topbar{gap:6px;padding:10px}
  .topbar h1{display:none}
}

/* Cards and forms */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 12px;font-size:1.15rem;color:var(--teal-d)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.card-head h2{margin:0;min-width:0}
.btn-new{border-color:var(--apricot);background:var(--apricot-l);color:var(--teal-d);min-height:40px;padding:4px 14px 4px 10px}
.btn-new:hover{background:var(--apricot)}
.btn-new svg{width:18px;height:18px;flex:none}
.card h3{margin:0;font-size:1rem;color:var(--teal-d)}
.field{margin:0 0 12px;min-width:0}
.field label,.field-label{display:block;font-weight:600;margin:0 0 4px;font-size:.95rem}
.hint{font-size:.85rem;color:var(--muted);margin:4px 0 0}
input[type=text],input[type=date],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-width:0}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--danger);background:var(--danger-l)}
.field-error{color:var(--danger);font-size:.88rem;font-weight:600;margin-top:4px}
.field-error:empty{display:none}
.grid-2{display:grid;grid-template-columns:1fr;gap:0 16px}
@media (min-width:700px){.grid-2{grid-template-columns:1fr 1fr}}
.radio-group{display:flex;gap:8px;flex-wrap:wrap}
.radio-pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:#fff}
.radio-pill:has(input:checked){border-color:var(--teal);background:var(--teal-l)}
.radio-pill input{accent-color:var(--teal);width:18px;height:18px}
.notice{border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:.92rem}
.notice-info{background:var(--sage-l);color:var(--teal-d)}
.notice-warn{background:var(--apricot-l);color:#6B3412;border:1px solid var(--apricot)}
.notice-error{background:var(--danger-l);color:var(--danger);border:1px solid var(--danger)}
#error-summary h2{color:var(--danger);font-size:1rem;margin:0 0 6px}
#error-summary ul{margin:0;padding-left:20px}
#error-summary a{color:var(--danger);font-weight:600}

.person-row{margin-bottom:10px}
.person-input-wrap{display:flex;gap:8px;min-width:0}
.person-input-wrap input{flex:1}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.expense-card{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;background:#fff;min-width:0}
.expense-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.amount-wrap{position:relative;display:flex;min-width:0}
.amount-wrap input{border-top-right-radius:0;border-bottom-right-radius:0;flex:1;min-width:0}
.tax-btn{flex:none;min-height:44px;max-width:60%;padding:6px 10px;border:1.5px solid var(--teal);border-left:none;border-radius:0 10px 10px 0;background:var(--teal);color:#fff;font-weight:600;cursor:pointer;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tax-btn:hover{background:var(--teal-d)}
.tax-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:25;min-width:200px;background:#fff;border:1.5px solid var(--teal);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;display:flex;flex-direction:column}
.tax-item{min-height:42px;text-align:left;padding:8px 12px;border:none;border-radius:8px;background:transparent;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.tax-item:hover,.tax-item:focus{background:var(--teal-l)}
.tax-item[aria-checked="true"]{font-weight:700;color:var(--teal-d)}
.tax-item[aria-checked="true"]::before{content:"✓ "}
.tax-item small{color:var(--muted)}
.exp-calc{font-size:.9rem;color:var(--teal-d);background:var(--sage-l);border-radius:8px;padding:6px 10px;margin-top:6px}
.exp-calc b{font-weight:700}
fieldset.shares{border:1.5px solid var(--line);border-radius:10px;padding:10px;margin:0;min-width:0}
fieldset.shares legend{font-weight:600;padding:0 4px;font-size:.95rem}
.share-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.share-count{font-size:.88rem;color:var(--muted);margin-left:auto}
.share-list{display:flex;flex-wrap:wrap;gap:8px}
.share-chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:var(--cream);max-width:100%;overflow-wrap:anywhere}
.share-chip:has(input:checked){border-color:var(--teal);background:var(--teal-l)}
.share-chip input{width:18px;height:18px;accent-color:var(--teal)}
@media (min-width:700px){
  .expense-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .expense-grid .span-2{grid-column:1/-1}
}
.summary-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.summary-list div{background:var(--cream);border-radius:10px;padding:8px;text-align:center;min-width:0}
.summary-list dt{font-size:.8rem;color:var(--muted)}
.summary-list dd{margin:0;font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
#btn-calc{width:100%;min-height:52px;font-size:1.05rem}

/* Result */
.result-head{background:var(--teal-d);color:#fff;border:none}
.result-head h2{color:#fff;font-size:1.3rem;margin-bottom:6px;overflow-wrap:anywhere}
.result-head p{margin:0;opacity:.95}
.result-expense{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.result-expense h3{margin-bottom:8px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:4px 12px;margin:0;font-size:.93rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.rule-list{margin:8px 0 0;padding-left:20px;font-size:.93rem}
.rule-list li{margin-bottom:4px;overflow-wrap:anywhere}
table.people-table{width:100%;border-collapse:collapse;font-size:.93rem}
.people-table th,.people-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.people-table th:first-child,.people-table td:first-child{text-align:left;overflow-wrap:anywhere}
.people-table th{color:var(--muted);font-weight:600;font-size:.85rem}
.people-table .send-cell{color:var(--danger);font-weight:700}
.people-table .recv-cell{color:var(--ok);font-weight:700}
@media (max-width:640px){
  .people-table thead{display:none}
  .people-table,.people-table tbody,.people-table tr,.people-table td{display:block;width:100%}
  .people-table tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;background:#fff}
  .people-table td{display:flex;justify-content:space-between;gap:10px;border:none;padding:4px 0;text-align:right}
  .people-table td::before{content:attr(data-label);color:var(--muted);font-weight:600;text-align:left}
  .people-table td:first-child{font-weight:700;font-size:1rem}
  .people-table td.msg-cell{justify-content:flex-end}
  .people-table td.msg-cell::before{content:none}
}
.guide{background:var(--cream);border-radius:12px;padding:12px;margin-top:10px}
.guide h3{margin:0 0 6px;overflow-wrap:anywhere}
.guide p{margin:4px 0}
.guide ul{margin:6px 0 0;padding-left:20px}
.guide .big{font-size:1.25rem;font-weight:800;color:var(--teal-d)}
.transfer-list{list-style:none;margin:0;padding:0}
.transfer-list li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;font-weight:700;overflow-wrap:anywhere}
.result-actions{display:flex;flex-wrap:wrap;gap:10px}
.result-actions .btn{flex:1 1 160px}
#copy-fallback,#message-text{width:100%;min-height:200px;font-family:inherit;font-size:.9rem;line-height:1.5;resize:vertical;margin-top:8px}

/* Dialogs */
dialog{border:none;border-radius:18px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;background:var(--paper);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,40,38,.5)}
.dialog-body{padding:20px}
.dialog-body h2{margin:0 0 8px;font-size:1.15rem;color:var(--teal-d);overflow-wrap:anywhere}
.dialog-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.status{font-size:.9rem;margin-top:8px;font-weight:600}
.status.ok{color:var(--ok)}
.status.err{color:var(--danger)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo-symbol" viewBox="0 0 40 40">
      <rect x="1" y="1" width="38" height="38" rx="11" fill="#1F5F5B"/>
      <rect x="8" y="17" width="24" height="15" rx="3" fill="#FBF6EC"/>
      <path d="M8 19 Q20 7 32 19 Z" fill="#9DB592"/>
      <rect x="8" y="18" width="24" height="3" fill="#143F3C"/>
      <circle cx="20" cy="24.5" r="4.2" fill="#F2A57A"/>
      <path d="M18 24.6 l1.4 1.4 l2.8 -2.9" stroke="#143F3C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="home-icon" viewBox="0 0 24 24">
      <path d="M3 11.5 L12 4 L21 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5.5 10 V20 H10 V14.5 H14 V20 H18.5 V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<!-- ============ START SCREEN ============ -->
<section id="screen-start" aria-labelledby="start-title">
  <svg class="start-bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <rect width="1200" height="800" fill="#FBF6EC"/>
    <circle cx="930" cy="150" r="120" fill="#FCE5D5"/>

/* ---------- utilities ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function charLen(s) { return Array.from(s).length; }
function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function t(key, p) {
  var dict = I18N[state.lang] || I18N.ko;
  var ck = key + '_' + state.currency;
  var s = dict[ck] != null ? dict[ck] : I18N.ko[ck];
  if (s == null) s = dict[key];
  if (s == null) s = I18N.ko[key];
  if (s == null) return key;
  if (p) s = s.replace(/\{(\w+)\}/g, function (m, k) { return p[k] != null ? p[k] : m; });
  return s;
}
/* USD amounts are stored and computed as integer cents; KRW/JPY as whole units. */
function minorPerUnit() { return state.currency === 'USD' ? 100 : 1; }
function money(n) {
  var s = state.currency === 'USD'
    ? num(Math.floor(n / 100)) + '.' + (n % 100 < 10 ? '0' : '') + (n % 100)
    : num(n);
  return t('fmt' + state.currency, { n: s });
}
function unit() { return t('unit' + state.currency); }
function honor(name) { return t('honor', { name: name }); }

/* ---------- state ---------- */
function mkPerson(s) { s.seq += 1; return { id: 'p' + s.seq, name: '' }; }
function mkExpense(s) {
  s.seq += 1;
  return { id: 'e' + s.seq, desc: '', amount: '', tax: 'incl', payer: '', shares: s.people.map(function (p) { return p.id; }) };
}
function defaultState(lang, currency) {
  var s = {
    lang: lang || 'ko', screen: 'start', currency: currency || 'KRW',
    meeting: { name: '', date: todayStr() },
    people: [], expenses: [], seq: 0,
    hasResult: false, stale: false, showErrors: false, selectedPerson: null
  };
  s.people.push(mkPerson(s), mkPerson(s));
  s.expenses.push(mkExpense(s));
  return s;
}

var memoryStore = null;
function save() {
  var data = JSON.stringify(state);
  try { sessionStorage.setItem(STORAGE_KEY, data); } catch (e) { memoryStore = data; }
}
function load() {
  var raw = null;
  try { raw = sessionStorage.getItem(STORAGE_KEY); } catch (e) { raw = memoryStore; }
  if (!raw) return null;
  try {
    var s = JSON.parse(raw);
    if (!s || !Array.isArray(s.people) || !Array.isArray(s.expenses) || !s.meeting) return null;
    if (!I18N[s.lang]) s.lang = 'ko';
    if (CURRENCIES.indexOf(s.currency) < 0) s.currency = 'KRW';
    if (['start', 'input', 'result'].indexOf(s.screen) < 0) s.screen = 'start';
    s.meeting.name = String(s.meeting.name || '');
    s.meeting.date = String(s.meeting.date || '');
    s.people = s.people.filter(function (p) { return p && /^p\d+$/.test(p.id); }).map(function (p) { return { id: p.id, name: String(p.name || '') }; });
    s.expenses = s.expenses.filter(function (e) { return e && /^e\d+$/.test(e.id); }).map(function (e) {
      return {
        id: e.id, desc: String(e.desc || ''), amount: String(e.amount == null ? '' : e.amount),
        tax: TAX_KEYS.indexOf(e.tax) >= 0 ? e.tax : 'incl', payer: String(e.payer || ''),
        shares: Array.isArray(e.shares) ? e.shares.map(String) : []
      };
    });
    var maxSeq = 0;
    s.people.concat(s.expenses).forEach(function (x) { maxSeq = Math.max(maxSeq, parseInt(x.id.slice(1), 10) || 0); });
    s.seq = Math.max(Number(s.seq) || 0, maxSeq);
    s.hasResult = !!s.hasResult; s.stale = !!s.stale; s.showErrors = !!s.showErrors;
    return s;
  } catch (e) { return null; }
}

/* ---------- calculation ---------- */
function parseAmount(raw) {
  var s = String(raw == null ? '' : raw)
    .replace(/[\uFF10-\uFF19]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/[\uFF0C]/g, ',').replace(/[\uFF0E]/g, '.').replace(/[\uFF0D\u2212]/g, '-')
    .trim();
  if (s === '') return { ok: false, err: 'empty' };
  s = s.replace(/,/g, '');
  if (/^-\s*\d+(\.\d+)?$/.test(s)) return { ok: false, err: Number(s.replace(/\s/g, '')) === 0 ? 'zero' : 'neg' };
  var v;
  if (state.currency === 'USD') {
    var m = /^(\d*)\.?(\d*)$/.exec(s);
    if (!m || (m[1] === '' && m[2] === '')) return { ok: false, err: 'nan' };
    if (m[2].length > 2) return { ok: false, err: 'dec' };
    v = Number(m[1] || '0') * 100 + Number((m[2] + '00').slice(0, 2));
  } else {
    if (/^\d*\.\d+$/.test(s) || /^\d+\.$/.test(s)) return { ok: false, err: 'dec' };
    if (!/^\d+$/.test(s)) return { ok: false, err: 'nan' };
    v = Number(s);
  }
  if (v === 0) return { ok: false, err: 'zero' };
  if (v > MAX_AMOUNT * minorPerUnit()) return { ok: false, err: 'range' };
  return { ok: true, value: v };
}
function taxOf(amount, taxKey) {
  var rate = TAX_RATE[taxKey] || 0;
  return Math.floor((amount * rate + 50) / 100);
}
function isValidDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return false;
  var y = +m[1], mo = +m[2], d = +m[3];
  if (y < 1900 || mo < 1 || mo > 12 || d < 1) return false;
  var dt = new Date(y, mo - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
}
function personIds() { return state.people.map(function (p) { return p.id; }); }
function validShares(e) {
  var ids = personIds();
  return ids.filter(function (id) { return e.shares.indexOf(id) >= 0; });
}
function personLabel(p, i) { return p.name.trim() || t('personN', { n: i + 1 }); }
function expenseLabel(e, i) { return e.desc.trim() || t('expenseN', { n: i + 1 }); }

function validate() {
  var errs = [];
  function add(field, errEl, loc, key) { errs.push({ field: field, errEl: errEl, loc: loc, key: key }); }
  var mn = state.meeting.name.trim();
  if (!mn) add('meeting-name', 'err-meeting-name', t('locMeeting') + ' · ' + t('meetingName'), 'e_meetingName_empty');
  else if (charLen(mn) > 60) add('meeting-name', 'err-meeting-name', t('locMeeting') + ' · ' + t('meetingName'), 'e_meetingName_long');
  var d = state.meeting.date;
  var dateEl = document.getElementById('meeting-date');
  var badInput = dateEl && dateEl.validity && dateEl.validity.badInput;
  if (!d) add('meeting-date', 'err-meeting-date', t('locMeeting') + ' · ' + t('meetingDate'), badInput ? 'e_date_invalid' : 'e_date_empty');
  else if (!isValidDate(d)) add('meeting-date', 'err-meeting-date', t('locMeeting') + ' · ' + t('meetingDate'), 'e_date_invalid');

  if (state.people.length < 2) add('btn-add-person', 'err-people', t('locPeopleSec'), 'e_people_min');
  var counts = {};
  state.people.forEach(function (p) { var n = p.name.trim(); if (n) counts[n] = (counts[n] || 0) + 1; });
  state.people.forEach(function (p, i) {
    var n = p.name.trim(), loc = t('personN', { n: i + 1 });
    if (!n) add('person-' + p.id, 'err-person-' + p.id, loc, 'e_person_empty');
    else if (charLen(n) > 40) add('person-' + p.id, 'err-person-' + p.id, loc, 'e_person_long');
    else if (counts[n] > 1) add('person-' + p.id, 'err-person-' + p.id, loc, 'e_person_dup');
  });

  if (!state.expenses.length) add('btn-add-expense', 'err-expenses', t('locExpensesSec'), 'e_no_expense');
  var total = 0, firstAmount = null;
  var ids = personIds();
  state.expenses.forEach(function (e, i) {
    var base = t('expenseN', { n: i + 1 }) + ' · ';
    var pre = 'exp-' + e.id + '-';
    if (!firstAmount) firstAmount = pre + 'amount';
    var ds = e.desc.trim();
    if (!ds) add(pre + 'desc', 'err-' + pre + 'desc', base + t('desc'), 'e_desc_empty');
    else if (charLen(ds) > 100) add(pre + 'desc', 'err-' + pre + 'desc', base + t('desc'), 'e_desc_long');
    var a = parseAmount(e.amount);
    if (!a.ok) add(pre + 'amount', 'err-' + pre + 'amount', base + t('amountShort'), 'e_amount_' + a.err);
    else total += a.value + taxOf(a.value, e.tax);
    if (!e.payer || ids.indexOf(e.payer) < 0) add(pre + 'payer', 'err-' + pre + 'payer', base + t('payer'), 'e_payer_empty');
    if (validShares(e).length === 0) add('shares:' + e.id, 'err-' + pre + 'shares', base + t('shares'), 'e_shares_empty');
  });
  if (total > MAX_AMOUNT * minorPerUnit()) add(firstAmount || 'btn-calc', 'err-total', t('locSummary') + ' · ' + t('sumTotal'), 'e_total_range');
  return errs;
}

function compute() {
  var people = state.people.map(function (p) {
    return { id: p.id, name: p.name.trim(), paid: 0, burden: 0, send: 0, receive: 0, outgoing: [], incoming: [] };
  });
  var byId = {};
  people.forEach(function (p) { byId[p.id] = p; });
  var total = 0;
  var expenses = state.expenses.map(function (e) {
    var amount = parseAmount(e.amount).value;
    var add = taxOf(amount, e.tax);
    var fin = amount + add;
    var shareIds = validShares(e);
    var n = shareIds.length;
    var base = Math.floor(fin / n), rem = fin % n;
    var remIds = shareIds.slice(0, rem);
    shareIds.forEach(function (id, idx) { byId[id].burden += base + (idx < rem ? 1 : 0); });
    byId[e.payer].paid += fin;
    total += fin;
    return {
      id: e.id, desc: e.desc.trim(), payerName: byId[e.payer].name, amount: amount, tax: e.tax, add: add, final: fin,
      shareNames: shareIds.map(function (id) { return byId[id].name; }), n: n, base: base, rem: rem,
      remNames: remIds.map(function (id) { return byId[id].name; })
    };
  });
  var senders = [], receivers = [];
  people.forEach(function (p) {
    var bal = p.burden - p.paid;
    if (bal > 0) { p.send = bal; senders.push({ p: p, r: bal }); }
    else if (bal < 0) { p.receive = -bal; receivers.push({ p: p, r: -bal }); }
  });
  var transfers = [];
  var i = 0, j = 0;
  while (i < senders.length && j < receivers.length) {
    var amt = Math.min(senders[i].r, receivers[j].r);
    if (amt > 0) {
      transfers.push({ from: senders[i].p.name, to: receivers[j].p.name, amount: amt });
      senders[i].p.outgoing.push({ name: receivers[j].p.name, amount: amt });
      receivers[j].p.incoming.push({ name: senders[i].p.name, amount: amt });
    }
    senders[i].r -= amt; receivers[j].r -= amt;
    if (senders[i].r === 0) i++;
    if (receivers[j].r === 0) j++;
  }
  return {
    meetingName: state.meeting.name.trim(), date: state.meeting.date,
    total: total, people: people, expenses: expenses, transfers: transfers
  };
}

/* ---------- render ---------- */
function render() {

  $('#app').hidden = s === 'start';
  $('#screen-input').hidden = s !== 'input';
  $('#screen-result').hidden = s !== 'result';
  if (s === 'input') {
    $('#page-title').textContent = t('inputTitle');

  } else if (s === 'result') {
    $('#page-title').textContent = t('resultTitle');

  }

  if ($('#message-dialog').open && msgPerson) fillMessage();
}

/* ---------- text builders ---------- */
function buildSettlementText() {
  var r = result, L = [];
  L.push(t('txtHeader'));
  L.push(t('txtMeeting') + ': ' + r.meetingName);
  L.push(t('date') + ': ' + r.date);
  L.push(t('currency') + ': ' + t(state.currency));
  L.push(t('totalSpend') + ': ' + money(r.total) + ' / ' + t('peopleCount') + ': ' + t('peopleUnit', { n: r.people.length }));
  L.push('');
  L.push('■ ' + t('sec_expenses'));
  r.expenses.forEach(function (e, i) {
    L.push((i + 1) + '. ' + e.desc + ' — ' + t('payer') + ': ' + e.payerName);
    L.push('   ' + t('inputAmount') + ' ' + money(e.amount) + ' / ' + t('taxChoice') + ' ' + t('tax_' + e.tax) +
      ' / ' + t('addTax') + ' ' + money(e.add) + ' / ' + t('finalAmount') + ' ' + money(e.final));
    L.push('   ' + t('shares') + ': ' + e.shareNames.join(', ') + ' (' + t('peopleUnit', { n: e.n }) + ') / ' +
      t('baseShare') + ' ' + money(e.base) + ' / ' + remainderText(e));
  });
  L.push('');
  L.push('■ ' + t('sec_people'));
  r.people.forEach(function (p) {
    L.push('- ' + p.name + ': ' + t('paid') + ' ' + money(p.paid) + ' / ' + t('burden') + ' ' + money(p.burden) +
      ' / ' + t('send') + ' ' + money(p.send) + ' / ' + t('receive') + ' ' + money(p.receive));
  });
  L.push('');
  L.push('■ ' + t('sec_transfers'));
  if (r.transfers.length) r.transfers.forEach(function (x) { L.push('- ' + x.from + ' → ' + x.to + ': ' + money(x.amount)); });
  else L.push(t('noTransfers'));
  return L.join('\n');
}
function buildMessageText(pid) {
  var p = result.people.filter(function (x) { return x.id === pid; })[0];
  if (!p) return '';
  var L = [t('msgTo', { name: honor(p.name) }), '', buildSettlementText(), ''];
  L.push('■ ' + t('txtPersonal', { name: honor(p.name) }));
  L.push(t('paid') + ': ' + money(p.paid));
  L.push(t('burden') + ': ' + money(p.burden));
  if (p.send > 0) {
    L.push(t('send') + ': ' + money(p.send));
    p.outgoing.forEach(function (o) { L.push('  → ' + o.name + ': ' + money(o.amount)); });
  } else if (p.receive > 0) {
    L.push(t('pg_noSend'));
    L.push(t('receive') + ': ' + money(p.receive));
    p.incoming.forEach(function (o) { L.push('  ← ' + o.name + ': ' + money(o.amount)); });
  } else {
    L.push(t('send') + ': ' + money(0) + ' / ' + t('receive') + ': ' + money(0));
    L.push(t('msgNoExtra'));
  }
  return L.join('\n');
}

/* ---------- clipboard ---------- */
function copyViaTextarea(ta) {
  try {
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    return document.execCommand('copy');
  } catch (e) { return false; }
}
function copyText(text, fallbackTa) {
  return new Promise(function (resolve) {
    function legacy() {
      var ta = fallbackTa, temp = false;
      if (!ta) {
        ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
        document.body.appendChild(ta); temp = true;
      }
      var ok = copyViaTextarea(ta);
      if (temp) ta.remove();
      resolve(ok);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, legacy);
        return;
      }
    } catch (e) { /* fall through */ }
    legacy();
  });
}

var inputScreen = $('#screen-input');
inputScreen.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.id === 'meeting-name') state.meeting.name = el.value;
  else if (el.id === 'meeting-date') state.meeting.date = el.value;
  else if (el.classList.contains('person-name')) {
    var p = state.people.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
    if (!p) return;
    p.name = el.value;
    updateNameDisplays();
  } else if (el.classList.contains('exp-desc')) {
    findExp(el.getAttribute('data-exp')).desc = el.value;
  } else if (el.classList.contains('exp-amount')) {
    var e = findExp(el.getAttribute('data-exp'));
    e.amount = el.value;
    updateRowCalc(e);
  } else return;
  afterChange();
});
inputScreen.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.name === 'currency') {
    state.currency = el.value;
    afterChange();
    renderExpenses();
    refreshErrors();
    updateSummary();
    return;
  }
  if (el.id === 'meeting-date') { state.meeting.date = el.value; afterChange(); return; }
  if (el.classList.contains('exp-payer')) {
    findExp(el.getAttribute('data-exp')).payer = el.value;
    afterChange();
    return;
  }
  if (el.classList.contains('share-cb')) {
    var e = findExp(el.getAttribute('data-exp'));
    var set = validShares(e);
    if (el.checked && set.indexOf(el.value) < 0) set.push(el.value);
    if (!el.checked) set = set.filter(function (id) { return id !== el.value; });
    var order = personIds();
    e.shares = order.filter(function (id) { return set.indexOf(id) >= 0; });
    updateShareCount(e);
    afterChange();
  }
});
inputScreen.addEventListener('click', function (ev) {
  var tgt = ev.target;
  var a = tgt.closest('[data-focus]');
  if (a) { ev.preventDefault(); focusField(a.getAttribute('data-focus')); return; }
  if (tgt.closest('#btn-add-person')) {
    var p = mkPerson(state);
    state.people.push(p);
    renderPeople();
    updateNameDisplays();
    showPeopleMsg(state.expenses.length ? t('newPersonNotice') : '');
    afterChange();
    document.getElementById('person-' + p.id).focus();
    return;
  }
  var pd = tgt.closest('.person-del');
  if (pd) {
    var pid = pd.getAttribute('data-id');
    var idx = state.people.findIndex(function (x) { return x.id === pid; });
    var asPayer = state.expenses.findIndex(function (e) { return e.payer === pid; });
    if (asPayer >= 0) {
      showPeopleMsg(t('personIsPayer', { name: honor(personLabel(state.people[idx], idx)), desc: expenseLabel(state.expenses[asPayer], asPayer) }), true);
      return;
    }
    state.people.splice(idx, 1);
    state.expenses.forEach(function (e) { e.shares = e.shares.filter(function (id) { return id !== pid; }); });
    showPeopleMsg('');
    renderPeople(); renderExpenses();
    afterChange();
    var next = $$('.person-name')[Math.min(idx, state.people.length - 1)];
    (next || $('#btn-add-person')).focus();
    return;
  }
  if (tgt.closest('#btn-add-expense')) {
    var e = mkExpense(state);
    state.expenses.push(e);
    renderExpenses();
    afterChange();
    document.getElementById('exp-' + e.id + '-desc').focus();
    return;
  }
  var ed = tgt.closest('.exp-del');
  if (ed) {
    var eid = ed.getAttribute('data-id');
    var ei = state.expenses.findIndex(function (x) { return x.id === eid; });
    state.expenses.splice(ei, 1);
    renderExpenses();
    afterChange();
    var nd = $$('.exp-desc')[Math.min(ei, state.expenses.length - 1)];
    (nd || $('#btn-add-expense')).focus();
    return;
  }
  var tb = tgt.closest('.tax-btn');
  if (tb) {
    var menu = document.getElementById(tb.id + 'menu');
    if (menu.hidden) openTaxMenu(tb.getAttribute('data-exp')); else closeTaxMenus();
    return;
  }
  var ti = tgt.closest('.tax-item');
  if (ti) { chooseTax(ti.getAttribute('data-exp'), ti.getAttribute('data-tax')); return; }
  var sa = tgt.closest('.share-all'), sn = tgt.closest('.share-none');
  if (sa || sn) {
    var ex = findExp((sa || sn).getAttribute('data-exp'));
    ex.shares = sa ? personIds() : [];
    document.getElementById('exp-' + ex.id + '-sharelist').innerHTML = shareListHTML(ex);
    updateShareCount(ex);
    afterChange();
    return;
  }
  if (tgt.closest('#btn-calc')) { onCalc(); return; }
});
inputScreen.addEventListener('keydown', function (ev) {
  var item = ev.target.closest && ev.target.closest('.tax-item');
  var tb = ev.target.closest && ev.target.closest('.tax-btn');
  if (tb && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
    ev.preventDefault(); openTaxMenu(tb.getAttribute('data-exp')); return;
  }
  if (!item) {
    if (ev.key === 'Enter' && ev.target.matches('input[type=text], input[type=date]')) {
      ev.preventDefault();
    }
    return;
  }
  var items = $$('.tax-item', item.parentNode);
  var i = items.indexOf(item);
  var expId = item.getAttribute('data-exp');
  if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (ev.key === 'Home') { ev.preventDefault(); items[0].focus(); }
  else if (ev.key === 'End') { ev.preventDefault(); items[items.length - 1].focus(); }
  else if (ev.key === 'Escape') { ev.preventDefault(); closeTaxMenus(); document.getElementById('exp-' + expId + '-tax').focus(); }
  else if (ev.key === 'Tab') { closeTaxMenus(); }
});

});
$('#message-select-all').addEventListener('click', function () {
  var ta = $('#message-text');
  ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  $('#message-status').textContent = t('msgSelected'); $('#message-status').className = 'status';
});
$('#message-close').addEventListener('click', function () { $('#message-dialog').close(); });
$('#message-dialog').addEventListener('close', function () {
  msgPerson = null;
  if (lastOpener && document.body.contains(lastOpener)) lastOpener.focus();
});

window.addEventListener('pagehide', save);

/* ---------- init ---------- */
(function init() {
  if (state.hasResult || state.screen === 'result') {
    var errs = validate();
    if (!errs.length && state.hasResult) {
      result = compute();
    } else {
      state.hasResult = false; result = null;
      if (state.screen === 'result') state.screen = 'input';
    }
  }
  render();
  save();
})();

/* Service workers need http(s); opening the file directly (file://) still works without one. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

})();
</script>
</body>
